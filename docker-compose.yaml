# docker compose up --build  →  the app on http://localhost:8000, the dummy mailbox on :8025.
#
# Accounts are Ory Kratos (deploy/kratos/). The app proxies Kratos's public API at /kratos/,
# so Kratos has no host port. Mailpit catches every email Kratos sends (password recovery codes).
#
# Instance settings go in a gitignored .env file next to this one (copy .env.example). Reached at
# another address than http://localhost:8000? Set ILP_PUBLIC_URL (no trailing slash). Before
# exposing the app, set ILP_KRATOS_COOKIE_SECRET and ILP_KRATOS_CIPHER_SECRET, serve it over
# HTTPS and set ILP_SECURE_COOKIES=true.

x-kratos-env: &kratos-env
  # The defaults are the public placeholders from deploy/kratos/kratos.yml: fine on localhost,
  # never anywhere else. The cipher secret must be exactly 32 characters.
  SECRETS_COOKIE: ${ILP_KRATOS_COOKIE_SECRET:-CHANGE-ME-cookie-secret-0000000000000}
  SECRETS_CIPHER: ${ILP_KRATOS_CIPHER_SECRET:-CHANGE-ME-cipher-secret-00000000}
  COOKIES_SECURE: ${ILP_SECURE_COOKIES:-false}
  SESSION_COOKIE_SECURE: ${ILP_SECURE_COOKIES:-false}
  DSN: sqlite:///var/lib/sqlite/kratos.sqlite?_fk=true&mode=rwc
  SERVE_PUBLIC_BASE_URL: ${ILP_PUBLIC_URL:-http://localhost:8000}/kratos/
  SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${ILP_PUBLIC_URL:-http://localhost:8000}/
  SELFSERVICE_ALLOWED_RETURN_URLS: ${ILP_PUBLIC_URL:-http://localhost:8000}
  SELFSERVICE_FLOWS_ERROR_UI_URL: ${ILP_PUBLIC_URL:-http://localhost:8000}/login
  SELFSERVICE_FLOWS_LOGIN_UI_URL: ${ILP_PUBLIC_URL:-http://localhost:8000}/login
  SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${ILP_PUBLIC_URL:-http://localhost:8000}/login
  SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${ILP_PUBLIC_URL:-http://localhost:8000}/register
  SELFSERVICE_FLOWS_RECOVERY_UI_URL: ${ILP_PUBLIC_URL:-http://localhost:8000}/recover
  SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${ILP_PUBLIC_URL:-http://localhost:8000}/account

x-kratos-volumes: &kratos-volumes
  - ./deploy/kratos:/etc/config/kratos:ro
  # A named volume, not a bind mount: Kratos runs as a non-root user and its SQLite file has
  # the same shared-memory trouble on Windows/macOS bind mounts as ours (see the Dockerfile).
  - kratos-data:/var/lib/sqlite

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Set ILP_DEV=1 to enable auto-reload and the dev-only tools (element gallery, time travel).
      ILP_DEV: ${ILP_DEV:-}
      # multi: accounts through Kratos. single: no accounts, one local learner.
      ILP_MODE: ${ILP_MODE:-multi}
      ILP_KRATOS_URL: http://kratos:4433
      # Cloudflare Turnstile. Empty = placeholder mode (see docs/ARCHITECTURE.md, Accounts).
      ILP_TURNSTILE_SITE_KEY: ${ILP_TURNSTILE_SITE_KEY:-}
      ILP_TURNSTILE_SECRET: ${ILP_TURNSTILE_SECRET:-}
    volumes:
      # Content and elements are mounted so they can be edited without a rebuild.
      # Set ILP_CONTENT_HOST_DIR (e.g. in a gitignored .env) to use an external content repo.
      - ${ILP_CONTENT_HOST_DIR:-./content}:/app/content
      - ./elements:/app/elements
      # The SQLite database (progress, added subjects) lives here and survives recreation.
      - ./data:/app/data
    depends_on:
      kratos:
        condition: service_started
    restart: unless-stopped

  # Creates or upgrades Kratos's tables, then exits.
  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: migrate sql --read-from-env --yes
    environment: *kratos-env
    volumes: *kratos-volumes
    restart: "no"

  kratos:
    image: oryd/kratos:v26.2.0
    command: serve --config /etc/config/kratos/kratos.yml --watch-courier --sqa-opt-out
    environment: *kratos-env
    volumes: *kratos-volumes
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Dummy email service: accepts SMTP on :1025 and shows every message at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  kratos-data:
