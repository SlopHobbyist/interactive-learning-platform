# yaml-language-server: $schema=../../../_schema/lesson.schema.json
title: The war in order
description: Where it happened and in what sequence.
xp: 15
items:
  - type: explanation
    id: map
    title: Thirteen colonies on one coast
    body: |
      Everything happened along a strip of Atlantic coast. The war opened in **New England**
      (Boston, Lexington, Concord), the political centre was **Philadelphia** in the middle
      colonies, the turning point came at **Saratoga** in New York, and the war was decided in
      the south at **Yorktown**, Virginia.

      ![Schematic map of the thirteen colonies with Boston, Saratoga, Philadelphia and Yorktown marked](assets/colonies-map.svg)

      New England, the middle colonies and the southern colonies had different economies and
      different grievances, but by 1776 they signed one declaration.

  - type: order
    id: chronology
    prompt: Put these events in chronological order.
    steps:
      - Boston Tea Party
      - Battles of Lexington and Concord
      - Declaration of Independence
      - Battle of Saratoga
      - Surrender at Yorktown
      - Treaty of Paris
    explain: "1773 tea, 1775 first shots, 1776 declaration, 1777 Saratoga, 1781 Yorktown, 1783 peace."

  - type: multiple-choice
    id: first-shots
    prompt: Where were the first shots of the war fired?
    choices: [Lexington and Concord, Yorktown, Saratoga, Philadelphia]
    answer: 0
    explain: British troops marched from Boston to seize arms at Concord. Militia met them at Lexington on the way, in April 1775.

  - type: multiple-choice
    id: saratoga-why
    prompt: Why was the victory at Saratoga so important?
    choices:
      - It convinced France to enter the war on the American side
      - It ended the war
      - It was the first battle of the war
      - It captured King George III
    answer: 0
    explain: After Saratoga, Benjamin Franklin could persuade France that the Americans could win. French ships and troops made Yorktown possible.

  - type: true-false
    id: yorktown-end
    prompt: The surrender at Yorktown in 1781 was the last major battle of the war.
    answer: true
    explain: Fighting mostly stopped after Yorktown, but the formal peace, the Treaty of Paris, took until 1783.

  - type: fill-blank
    id: fill-regions
    prompt: "The war began in ___ England, the Declaration was signed in ___, and it ended with a surrender at ___."
    answers: [New, Philadelphia, Yorktown]
    bank: [Boston, Saratoga, Paris]
    explain: North to south — New England, Philadelphia in the middle colonies, Yorktown in Virginia.

  - type: short-answer
    id: which-colony
    prompt: Yorktown is in which colony?
    answers: [Virginia]
    explain: Yorktown sits on the Virginia coast, which is why the French fleet could trap Cornwallis there.

  - type: multiple-choice
    id: regions
    prompt: Which of these were **New England** colonies?
    choices: [Massachusetts, Connecticut, Virginia, Georgia]
    answer: [0, 1]
    explain: Massachusetts, New Hampshire, Rhode Island and Connecticut made up New England. Virginia and Georgia were southern colonies.
