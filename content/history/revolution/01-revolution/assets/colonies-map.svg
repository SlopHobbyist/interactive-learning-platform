<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" aria-labelledby="t d">
  <title id="t">Schematic map of the thirteen colonies</title>
  <desc id="d">The thirteen colonies listed north to south along the Atlantic coast, with the sites of Boston, Lexington and Concord, Saratoga, Philadelphia and Yorktown marked. Not to scale.</desc>
  <style>
    .bg { fill: #f3efe6; }
    .sea { fill: #cfdfe8; }
    .land { fill: #e4dcc8; stroke: #8a7f66; stroke-width: 1.5; }
    .ne { fill: #d9d2bd; }
    .mid { fill: #e0d7bf; }
    .south { fill: #e7dcc0; }
    .label { font: 500 15px 'Roboto', 'Segoe UI', Arial, sans-serif; fill: #2c2a24; }
    .small { font: 12px 'Roboto', 'Segoe UI', Arial, sans-serif; fill: #4b473d; }
    .site { fill: #b23a3a; stroke: #f3efe6; stroke-width: 2; }
    .sitelabel { font: 600 13px 'Roboto', 'Segoe UI', Arial, sans-serif; fill: #7a2222; }
    .title { font: 700 20px 'Sora', 'Segoe UI', Arial, sans-serif; fill: #2c2a24; }
    .sea-label { font: italic 15px 'Roboto', 'Segoe UI', Arial, sans-serif; fill: #3e5d6e; }
  </style>
  <rect class="bg" width="640" height="720"/>
  <path class="sea" d="M330 0 H640 V720 H300 C290 650 360 600 330 540 C300 480 380 430 350 370 C320 310 400 260 360 200 C330 150 380 90 350 40 Z"/>
  <text class="sea-label" x="470" y="380">Atlantic Ocean</text>

  <!-- New England -->
  <rect class="land ne" x="40" y="60" width="300" height="60" rx="8"/>
  <text class="label" x="56" y="97">Massachusetts (incl. Maine), New Hampshire</text>
  <rect class="land ne" x="40" y="126" width="300" height="44" rx="8"/>
  <text class="label" x="56" y="154">Rhode Island, Connecticut</text>

  <!-- Middle colonies -->
  <rect class="land mid" x="40" y="186" width="310" height="52" rx="8"/>
  <text class="label" x="56" y="218">New York</text>
  <rect class="land mid" x="40" y="244" width="310" height="52" rx="8"/>
  <text class="label" x="56" y="276">New Jersey, Pennsylvania, Delaware</text>

  <!-- Southern colonies -->
  <rect class="land south" x="40" y="312" width="320" height="52" rx="8"/>
  <text class="label" x="56" y="344">Maryland, Virginia</text>
  <rect class="land south" x="40" y="370" width="310" height="52" rx="8"/>
  <text class="label" x="56" y="402">North Carolina</text>
  <rect class="land south" x="40" y="428" width="300" height="52" rx="8"/>
  <text class="label" x="56" y="460">South Carolina</text>
  <rect class="land south" x="40" y="486" width="290" height="52" rx="8"/>
  <text class="label" x="56" y="518">Georgia</text>

  <!-- Sites -->
  <circle class="site" cx="328" cy="90" r="7"/>
  <text class="sitelabel" x="342" y="80">Boston, Lexington &amp; Concord (1775)</text>
  <circle class="site" cx="120" cy="196" r="7"/>
  <text class="sitelabel" x="134" y="186">Saratoga (1777)</text>
  <circle class="site" cx="300" cy="268" r="7"/>
  <text class="sitelabel" x="314" y="258">Philadelphia (1776)</text>
  <circle class="site" cx="330" cy="352" r="7"/>
  <text class="sitelabel" x="344" y="342">Yorktown (1781)</text>

  <text class="title" x="40" y="600">The thirteen colonies, 1775</text>
  <text class="small" x="40" y="624">Schematic, north to south. Not to scale.</text>
  <text class="small" x="40" y="644">New England · Middle colonies · Southern colonies</text>
  <rect class="land ne" x="40" y="660" width="18" height="12"/><text class="small" x="64" y="671">New England</text>
  <rect class="land mid" x="170" y="660" width="18" height="12"/><text class="small" x="194" y="671">Middle</text>
  <rect class="land south" x="260" y="660" width="18" height="12"/><text class="small" x="284" y="671">Southern</text>
  <circle class="site" cx="370" cy="666" r="6"/><text class="small" x="384" y="671">Key site (year)</text>
</svg>
