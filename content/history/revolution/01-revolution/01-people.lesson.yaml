# Auto-arranged: the platform builds recognition, matching and recall items from these facts.
title: People of the Revolution
description: Eight names you need, and what each of them did.
xp: 15
arrange: auto
source:
  notes: |
    A revolution is made by people. These eight come up again and again: generals, writers,
    diplomats, a king, and a silversmith on a fast horse. Learn **who did what**; the dates come
    in the next lesson.
  facts:
    - { term: George Washington, definition: Commander of the Continental Army, hint: later the first president }
    - { term: Thomas Jefferson, definition: Main author of the Declaration of Independence, hint: a Virginian with a pen }
    - { term: Benjamin Franklin, definition: Diplomat who won France over to the American side, hint: "printer, scientist, charmer" }
    - { term: King George III, definition: British monarch the colonies broke away from }
    - { term: Paul Revere, definition: Rider who warned that British troops were marching on Lexington, hint: "the British are coming" }
    - { term: Thomas Paine, definition: Author of the pamphlet *Common Sense*, hint: argued for independence in plain words }
    - { term: John Adams, definition: Delegate who pushed Congress toward independence, hint: later the second president }
    - { term: Marquis de Lafayette, definition: French officer who fought alongside Washington, hint: nineteen when he arrived }
