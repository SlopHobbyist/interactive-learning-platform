# yaml-language-server: $schema=../../../_schema/lesson.schema.json
title: Hello and goodbye
description: The greetings you will use every single day.
xp: 10
items:
  - type: explanation
    id: intro
    title: Saying hello
    body: |
      **Hola** means *hello*. It works at any time of day, with anyone.

      When you want to be a little more polite, pick the greeting for the time of day:

      | Spanish | English | when |
      |---|---|---|
      | **Buenos días** | Good morning | until about midday |
      | **Buenas tardes** | Good afternoon | midday until dark |
      | **Buenas noches** | Good evening / good night | after dark, and at bedtime |

      Notice *buenos* with **días** but *buenas* with **tardes** and **noches**: the word for
      *good* matches the noun that follows it.

  - type: multiple-choice
    id: hola-meaning
    prompt: What does **hola** mean?
    choices: [Hello, Goodbye, Please, Thank you]
    answer: 0
    explain: "*Hola* is the all-purpose greeting. You can say it morning, noon or night."

  - type: multiple-choice
    id: pick-morning
    prompt: It is 9 in the morning and you walk into a bakery. What do you say?
    choices: [Buenos días, Buenas tardes, Buenas noches, Adiós]
    answer: 0
    explain: "*Buenos días* is for the morning. *Adiós* would be saying goodbye as you walk in!"

  - type: fill-blank
    id: buenas-noches
    prompt: "It is 10 at night. ___ noches."
    answers: [Buenas]
    explain: "*Noches* is feminine, so the adjective is **buenas**. Only *días* takes *buenos*."

  - type: explanation
    id: goodbye
    title: Saying goodbye
    body: |
      - **Adiós** — *goodbye*. Fine for anyone, though it can sound a bit final.
      - **Hasta luego** — *see you later*. The most common everyday goodbye.
      - **Hasta mañana** — *see you tomorrow*.
      - **Chao** — *bye*. Casual, borrowed from Italian, very common in Latin America.

  - type: match-pairs
    id: match-greetings
    prompt: Match each Spanish phrase to its meaning.
    pairs:
      - { left: Hola, right: Hello }
      - { left: Buenos días, right: Good morning }
      - { left: Buenas tardes, right: Good afternoon }
      - { left: Adiós, right: Goodbye }
      - { left: Hasta luego, right: See you later }
    explain: "*Hasta* means *until*, so *hasta luego* is literally *until later*."

  - type: fill-blank
    id: hasta-manana
    prompt: "You will see your teacher tomorrow. ___ mañana."
    answers: [Hasta]
    bank: [Hola, Adiós, Buenos]
    explain: "*Hasta mañana* — until tomorrow."

  - type: flashcard
    id: card-hola
    front: "**hola**"
    back: hello
    hint: any time of day

  - type: flashcard
    id: card-hasta-luego
    front: "**hasta luego**"
    back: see you later
    hint: literally *until later*
