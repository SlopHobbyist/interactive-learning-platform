# yaml-language-server: $schema=../../../_schema/lesson.schema.json
title: Hello, print
description: Your first line of Python and what it does.
xp: 10
items:
  - type: explanation
    id: intro
    title: print()
    body: |
      A Python program is a list of instructions, read top to bottom. The first one everyone
      learns shows text on the screen:

      ```python
      print("Hello, world!")
      ```

      - `print` is a **function**: a named piece of behaviour you can call.
      - The parentheses `()` call it. What goes inside is the **argument**.
      - `"Hello, world!"` is a **string**: text, wrapped in quotes.

      Run it and you get:

      ```
      Hello, world!
      ```

      The quotes are not printed. They only tell Python where the text starts and ends.

  - type: multiple-choice
    id: output-simple
    prompt: |
      What does this print?

      ```python
      print("hi")
      ```
    choices: ["hi", "\"hi\"", "print(hi)", "nothing"]
    answer: 0
    shuffle: false
    explain: The quotes mark the string; they are not part of the output.

  - type: short-answer
    id: output-two-lines
    prompt: |
      Each `print` ends with a new line. What is the **second** line of output?

      ```python
      print("one")
      print("two")
      ```
    answers: ["two"]
    placeholder: type the second line
    explain: Every call to `print` writes its text and then moves to a new line.

  - type: true-false
    id: case-matters
    prompt: "`Print(\"hi\")` with a capital P does the same thing as `print(\"hi\")`."
    answer: false
    explain: Python is case-sensitive. `Print` is a different (undefined) name, so this is an error.

  - type: multiple-choice
    id: numbers-vs-strings
    prompt: |
      Which line prints the **number** 5 rather than text?

      ```python
      print("5")
      print(5)
      ```
    choices: ["`print(5)`", "`print(\"5\")`", "Both print a number", "Neither"]
    answer: 0
    explain: Without quotes, `5` is a number. With quotes it is a one-character string. They look the same on screen, but behave differently in arithmetic.

  - type: short-answer
    id: arithmetic
    prompt: |
      Python can do arithmetic inside `print`. What does this print?

      ```python
      print(2 + 3 * 4)
      ```
    answers: ["14"]
    explain: Multiplication happens before addition, just like in maths. `3 * 4` is 12, plus 2 is **14**.

  - type: order
    id: order-lines
    prompt: Arrange the lines so the program prints `a`, `b`, `c` in that order.
    steps:
      - "`print(\"a\")`"
      - "`print(\"b\")`"
      - "`print(\"c\")`"
    explain: Python runs statements top to bottom, so the order of lines is the order of output.

  - type: fill-blank
    id: fill-print
    prompt: "The function that writes text to the screen is called ___."
    answers: [print]
    explain: "`print` — always lowercase."
