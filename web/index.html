<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn</title>
<meta name="description" content="An interactive learning platform for any subject.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1e2021">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e2021'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%232196f3'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2393999f' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23535c65' stroke-width='2'/%3E%3C/svg%3E">
<!-- Everything is self-hosted: the design system, its fonts and icons, and every library. -->
<link rel="stylesheet" href="/vendor/wavefront/design_language.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/wavefront/design_language.js" defer></script>
<script type="module" src="/js/app.js"></script>
</head>
<body class="page">

<a class="skip-link" href="#main">Skip to content</a>

<div class="app-shell" id="app-shell">

  <aside class="drawer app-drawer" id="app-drawer" data-open="false" aria-hidden="true" aria-label="Subjects">
    <div class="drawer-header">
      <a class="app-brand" href="/" data-link>
        <span class="icon text-primary">waves</span>
        <span class="text-heading-3">Learn</span>
      </a>
      <span class="grow"></span>
      <button class="button button-icon button-icon-sm app-drawer-close" type="button" data-drawer-close aria-label="Close navigation">
        <span class="icon">close</span>
      </button>
    </div>
    <nav class="drawer-body stack stack-sm" aria-label="Main">
      <div id="nav-main"></div>
      <div class="drawer-section-title">Subjects</div>
      <div id="nav-subjects" aria-busy="true"></div>
      <div id="nav-dev" class="hidden">
        <div class="drawer-section-title">Developer</div>
        <a class="nav-item" href="/dev/elements" data-link><span class="icon">extension</span><span>Element gallery</span></a>
      </div>
    </nav>
  </aside>

  <div class="app-column">
    <header class="topbar app-topbar" id="app-topbar">
      <button class="button button-icon app-menu" type="button" data-drawer-open="app-drawer" aria-label="Open navigation">
        <span class="icon">menu</span>
      </button>
      <a class="topbar-title app-title" href="/" data-link id="topbar-title">Learn</a>
      <div class="topbar-actions">
        <a class="chip chip-clickable app-chip" href="/me" data-link id="chip-xp" title="XP today" aria-label="XP">
          <span class="icon icon-sm">bolt</span><span data-value>0</span>
        </a>
        <a class="chip chip-clickable app-chip" href="/me" data-link id="chip-streak" title="Streak" aria-label="Streak">
          <span class="icon icon-sm">local_fire_department</span><span data-value>0</span>
        </a>
        <button class="button button-icon" type="button" data-theme-toggle data-theme-label aria-pressed="false">
          <span class="icon">dark_mode</span>
        </button>
      </div>
    </header>

    <main id="main" class="page-body app-main" tabindex="-1"></main>
  </div>

</div>

<!-- First run: pick a daily goal (Wavefront dialog; opened by app.js when the profile has none). -->
<dialog class="dialog dialog-sm" id="goal-dialog" aria-labelledby="goal-dialog-title">
  <div class="dialog-header">
    <h2 class="dialog-title" id="goal-dialog-title">Pick a daily goal</h2>
  </div>
  <div class="dialog-body">
    <p class="text-muted mb-4">XP to earn each day to keep your streak. A short lesson is about 10 XP. You can change this in Settings.</p>
    <div class="segmented" role="group" aria-label="Daily goal" id="goal-dialog-picker">
      <button class="button" type="button" data-goal="10" aria-pressed="false">10 XP</button>
      <button class="button" type="button" data-goal="20" aria-pressed="true">20 XP</button>
      <button class="button" type="button" data-goal="30" aria-pressed="false">30 XP</button>
      <button class="button" type="button" data-goal="50" aria-pressed="false">50 XP</button>
    </div>
  </div>
  <div class="dialog-actions">
    <button class="button button-filled" type="button" id="goal-dialog-save" data-autofocus>Start learning</button>
  </div>
</dialog>

<noscript>
  <div class="container section"><p>This app needs JavaScript.</p></div>
</noscript>
</body>
</html>
