# The shop (shop_plan.md §6, §10). Prices are in coins. `slot` items are equipped one per slot;
# the `default: true` item of a slot is free and always owned. `asset` names the sound folder
# (web/assets/sounds/<asset>/), the effect or celebration (web/js/player/effects.js) or the combo
# meter or progress bar (web/js/player/skins.js). Kinds without a slot: `freeze` stacks up to
# the cap; `repair` and `wager` act when bought (progress/streak_tools.py). `steps` (sound packs
# only): the correct sound has that many pitches, correct-1.wav .. correct-<steps>.wav, and the
# player picks one by the current run of correct answers.

items:
  - key: streak_freeze
    kind: freeze
    title: Streak freeze
    description: Covers one missed day automatically. You can hold two.
    icon: ac_unit
    price: 100
  - key: streak_repair
    kind: repair
    title: Streak repair
    description: Brings back a streak that broke in the last two days.
    icon: build
    price: 200
  - key: streak_wager
    kind: wager
    title: Streak wager
    description: Bet 50 coins that you keep your streak for 7 days. Win 100.
    icon: casino
    price: 50

