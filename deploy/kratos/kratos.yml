# Ory Kratos: accounts, sessions and password recovery for ILP_MODE=multi.
#
# The app reverse-proxies Kratos's public API at /kratos/, so the browser talks to one origin and
# Kratos's cookies are first-party. Kratos itself is never published on a host port.
# Every URL below assumes the app is reached at http://localhost:8000; docker-compose.yaml
# overrides them from ILP_PUBLIC_URL (Kratos reads env vars such as SERVE_PUBLIC_BASE_URL).
version: v26.2.0

dsn: sqlite:///var/lib/sqlite/kratos.sqlite?_fk=true&mode=rwc

serve:
  public:
    base_url: http://localhost:8000/kratos/
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:8000/
  allowed_return_urls:
    - http://localhost:8000

  methods:
    password:
      enabled: true
      config:
        # Passwords are 32 random characters generated in the browser; checking them against
        # haveibeenpwned would be pointless and would call an external service.
        haveibeenpwned_enabled: false
        min_password_length: 32
    code:
      # Recovery codes by email. Not used to sign in.
      enabled: true
      passwordless_enabled: false
    link:
      enabled: false
    profile:
      # Usernames and emails are fixed after sign-up (the app has no screen to change them).
      enabled: false

  flows:
    error:
      ui_url: http://localhost:8000/login
    login:
      ui_url: http://localhost:8000/login
      lifespan: 1h
    logout:
      after:
        default_browser_return_url: http://localhost:8000/login
    registration:
      enabled: true
      style: unified
      ui_url: http://localhost:8000/register
      lifespan: 1h
      after:
        password:
          hooks:
            # Turnstile check. `parse: true` runs it before the identity is stored and lets a
            # 4xx answer abort the registration with a message (see server/app/api/auth.py).
            - hook: web_hook
              config:
                url: http://app:8000/api/auth/hooks/registration
                method: POST
                body: file:///etc/config/kratos/registration-hook.jsonnet
                response:
                  parse: true
            - hook: session
    recovery:
      enabled: true
      use: code
      ui_url: http://localhost:8000/recover
      lifespan: 1h
    verification:
      enabled: false
    settings:
      ui_url: http://localhost:8000/account
      privileged_session_max_age: 15m

identity:
  default_schema_id: learner
  schemas:
    - id: learner
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    # Mailpit (docker-compose.yaml) catches every message; read them at http://localhost:8025.
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@midnightcrammer.localhost
    from_name: MidnightCrammer

session:
  lifespan: 720h
  cookie:
    persistent: true
    same_site: Lax
    secure: "false"

# Plain-HTTP cookies (both `secure` flags above and here; Kratos types them as strings) so
# http://localhost works out of the box. Behind HTTPS set ILP_SECURE_COOKIES=true in .env
# (docker-compose.yaml passes it to Kratos as COOKIES_SECURE and SESSION_COOKIE_SECURE).
cookies:
  same_site: Lax
  secure: "false"

# Public placeholders, for localhost only. Do not edit them here: before exposing the app, set
# ILP_KRATOS_COOKIE_SECRET and ILP_KRATOS_CIPHER_SECRET in .env (docker-compose.yaml passes them
# to Kratos as SECRETS_COOKIE and SECRETS_CIPHER, which override these). The cookie secret signs
# sessions; the cipher secret (exactly 32 characters) encrypts stored tokens.
secrets:
  cookie:
    - CHANGE-ME-cookie-secret-0000000000000
  cipher:
    - CHANGE-ME-cipher-secret-00000000

log:
  level: info
  format: text
  leak_sensitive_values: false
